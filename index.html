<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BREACH</title>
    <meta name="description" content="BREACH: a fast multiplayer arena shooter in the browser, built on the Projection Lab engine.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="view" aria-label="The arena, seen through the player's eyes"></canvas>

    <div id="hud" aria-hidden="true">
        <div id="crosshair"></div>
        <pre id="debug"></pre>
    </div>

    <div id="overlay" class="screen">
        <div class="card">
            <h1>BREACH</h1>
            <p class="lede">Stage 1: move and look.</p>
            <button id="play" class="primary">Click to play</button>
            <dl class="keys">
                <dt>W A S D</dt><dd>move</dd>
                <dt>Mouse</dt><dd>look</dd>
                <dt>Space</dt><dd>jump</dd>
                <dt>Shift</dt><dd>sprint</dd>
                <dt>C</dt><dd>crouch</dd>
                <dt>Esc</dt><dd>release the mouse</dd>
            </dl>
        </div>
    </div>

    <script type="module" src="game/main.js"></script>
</body>
</html>
